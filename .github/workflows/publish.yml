name: publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Packages to publish. Both manifests must carry the same version;
          a package left out can be published later under that version.
        type: choice
        options:
          - both
          - nodejs
          - browser
        default: both

# One release dispatch at a time: a dispatch made while another is running
# waits for it, so its version check sees what the earlier one published.
# Otherwise two overlapping dispatches from different commits could both pass
# the check and split one version across the two commits. GitHub keeps only
# the newest waiting dispatch and cancels older waiting ones; a running
# publish is never cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Publish
    runs-on: ubuntu-latest
    # id-token lets npm trusted publishing trade this job's GitHub OIDC token
    # for a short-lived publish token, so the repository stores no long-lived
    # npm token.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: true

      - name: Linting
        run: pnpm eslint

      - name: Type-checking
        run: pnpm typecheck

      # This contract uses DOM libraries with no @types/node and covers only
      # the source graph shipped in @questdb/browser-client.
      - name: Type-checking (browser)
        run: pnpm typecheck:qwp-browser

      - name: Tests
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser bundle tests
        run: pnpm test:qwp-browser

      - name: Built package tests
        run: pnpm exec vitest run --config vitest.dist.config.ts

      # Guards the emitted .d.ts row typing, which no runtime suite can see.
      # Run the script rather than inlining its commands: hand-copying them
      # here dropped the TypeScript 4.9 leg, and publish.yml is
      # workflow_dispatch-only with no dependency on build.yml, so a dispatch
      # from a branch that never opened a pull request reached npm publish with
      # no legacy-consumer gate at all. The script re-runs `pnpm build`, which
      # is idempotent.
      - name: Type-checking (built package consumer)
        run: pnpm typecheck:dist

      # Checks both npm tarballs and follows every exported declaration and
      # runtime module through its relative dependency graph.
      - name: Check for build artifacts
        run: node scripts/check-build-artifacts.mjs

      # The selected packages are published from one commit, and each publish
      # step skips a version npm already has. Fail here instead of
      # half-releasing or publishing nothing.
      # Every gate above still covers both packages: they share client-core, so
      # a broken browser build is a broken build even on a Node-only release.
      - name: Check release versions
        env:
          RELEASE_PACKAGES: ${{ inputs.packages }}
        run: node scripts/check-release-versions.mjs

      # Trusted publishing needs npm >= 11.5.1 and Node 22 bundles npm 10, so
      # upgrade it only here, after every gate has run on the stock toolchain.
      - name: Install npm for trusted publishing
        run: npm install --global npm@11.21.1

      # npm publishes through trusted publishing (OIDC) and falls back to this
      # token whenever that fails: for a new package, which cannot have a
      # trusted publisher until it exists, but also for an existing package
      # whose trusted publisher does not match this workflow or has expired.
      # The token is the NPM_BOOTSTRAP_TOKEN secret, unset except to create a
      # new package (see "npm authentication" in CONTRIBUTING.md); `?` turns an
      # unset variable into no token rather than a literal one.
      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN?}" > "$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      # Dispatches run one at a time (see concurrency), so a version npm already
      # has here is the published half of a partial release that the version
      # check cleared to resume. It is skipped.
      - name: Publish @questdb/nodejs-client
        if: inputs.packages == 'both' || inputs.packages == 'nodejs'
        working-directory: packages/nodejs-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; skipping it."
          else
            npm publish --access public --provenance --ignore-scripts
          fi

      - name: Publish @questdb/browser-client
        if: inputs.packages == 'both' || inputs.packages == 'browser'
        working-directory: packages/browser-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; skipping it."
          else
            npm publish --access public --provenance --ignore-scripts
          fi
